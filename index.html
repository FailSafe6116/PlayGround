<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ASHEN COVENANT — Relic Hunter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Spectral:wght@400;600;700;800&display=swap');
:root{color-scheme:dark;--gold:#e5bd73;--red:#bd4a3f;--ink:#09090d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#e8dfd0;font-family:Spectral,Georgia,serif;touch-action:none}body{display:grid;place-items:center}.frame{position:relative;width:min(100vw,160vh);height:min(100vh,62.5vw);max-width:1600px;max-height:1000px;background:#11131a;overflow:hidden;box-shadow:0 0 90px #000}.frame:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 110px #000b,inset 0 0 0 1px #dcc28a22}.frame canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.topmark{position:absolute;left:28px;top:17px;font-size:12px;letter-spacing:.23em;color:#d9bd83;text-shadow:0 2px 6px #000;pointer-events:none}.topmark b{color:#fff3d4;font-weight:600}.controls{position:absolute;bottom:15px;left:28px;color:#c5b9a2a8;font:10px/1.5 Spectral,serif;letter-spacing:.04em;pointer-events:none}.mobile{display:none;position:absolute;inset:auto 0 16px;padding:0 16px;justify-content:space-between;align-items:end;pointer-events:none}.touchgroup{display:flex;gap:9px;pointer-events:auto}.touchbtn{height:54px;min-width:54px;border:1px solid #d6bd8055;border-radius:8px;background:#0a0a0bb8;color:#edd9ad;font:18px Georgia;box-shadow:inset 0 0 18px #a8842918;touch-action:none}.touchbtn:active{background:#a33127aa}.touchbtn.small{font-size:11px;letter-spacing:.06em}.sound{position:absolute;right:21px;top:16px;border:1px solid #d1b5794d;background:#090a0d99;color:#d7c18e;padding:6px 9px;border-radius:4px;font-size:11px;cursor:pointer;z-index:2}@media(max-width:700px){.topmark{top:9px;left:12px;font-size:9px}.controls{display:none}.mobile{display:flex}.sound{top:9px;right:10px}}
</style></head>
<body><main class="frame"><canvas id="game" width="1280" height="800" aria-label="Ashen Covenant game"></canvas><div class="topmark"><b>ASHEN COVENANT</b>　/　THE SUNKEN ABBEY</div><button class="sound" id="sound">♫ SOUND: ON</button><div class="controls">A / D MOVE　·　W / SPACE JUMP　·　J WHIP　·　K DODGE　·　E CLAIM RELIC　·　I SATCHEL</div><div class="mobile"><div class="touchgroup"><button class="touchbtn" data-key="a">◀</button><button class="touchbtn" data-key="d">▶</button><button class="touchbtn" data-key="w">↑</button></div><div class="touchgroup"><button class="touchbtn small" data-key="k">DODGE</button><button class="touchbtn small" data-key="j">WHIP</button><button class="touchbtn small" data-key="e">CLAIM</button></div></div></main>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=1280,H=800,worldW=3000,ground=676;
let keys={},last=0,now=0,screen='title',inventoryOpen=false,muted=false,audio=null,camera=0,shake=0;
let player,enemies=[],drops=[],particles=[],floating=[],platforms=[],wave=1,waveKills=0,kills=0,score=0,toast='',toastTime=0,selected=0;
const rarity=[{name:'COMMON',color:'#b8b0a1',glow:'#d6cbb2'},{name:'UNCOMMON',color:'#65c794',glow:'#60e6a1'},{name:'RARE',color:'#6e9ce8',glow:'#82b3ff'},{name:'EPIC',color:'#c17be1',glow:'#df91ff'},{name:'LEGENDARY',color:'#e4ae52',glow:'#ffe58c'}];
const names={weapon:['Grave-Tender','Widowmaker','Saint’s Thorn','Ashen Lash','The Last Rites','Red Mercy'],armor:['Abbey Cuirass','Warden’s Mantle','Veil of Cinders','Boneweave Coat','Pilgrim’s Shroud'],relic:['Blackened Reliquary','Moon-Salt Charm','The Unquiet Eye','Covenant Seal','Votive Heart']};
function init(){platforms=[{x:290,y:558,w:210,h:18},{x:590,y:468,w:230,h:18},{x:930,y:548,w:250,h:18},{x:1320,y:500,w:210,h:18},{x:1650,y:420,w:240,h:18},{x:2050,y:530,w:250,h:18},{x:2460,y:462,w:250,h:18}];player={x:150,y:ground-64,vx:0,vy:0,w:34,h:64,hp:100,maxHp:100,stamina:100,face:1,onGround:false,attack:0,dodge:0,invuln:0,level:1,xp:0,nextXp:100,gold:0,potions:3,gear:{weapon:null,armor:null,relic:null},stats:{damage:24,armor:0,speed:1}};enemies=[];drops=[];particles=[];floating=[];wave=1;waveKills=0;kills=0;score=0;camera=0;spawnWave();}
function spawnWave(){let count=3+wave*2;for(let i=0;i<count;i++){let x=Math.min(worldW-140,player.x+360+i*340+Math.random()*180);let elite=Math.random()<Math.min(.11+wave*.025,.32);enemies.push({x,y:ground-48,vx:0,vy:0,w:elite?48:38,h:48,hp:elite?95+wave*16:52+wave*12,maxHp:elite?95+wave*16:52+wave*12,elite,attack:0,hit:0,face:-1,stun:0});}}
init();
function sound(freq=220,dur=.07,type='triangle',vol=.025){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'♫ SOUND: OFF':'♫ SOUND: ON';if(!muted)sound(440)};
function keydown(e){let k=e.key.toLowerCase();if([' ','arrowup','arrowleft','arrowright','arrowdown'].includes(k))e.preventDefault();if(!keys[k]){if(screen==='title'&&(k==='enter'||k===' ')){screen='playing';sound(330,.16)}else if(screen==='dead'&&(k==='enter'||k===' ')){init();screen='playing'}else if(screen==='win'&&(k==='enter'||k===' ')){init();screen='playing'}else if(screen==='playing'){if(k==='j'||k===' ')attack();if(k==='k'||k==='shift')dodge();if(k==='e')pickup();if(k==='i')inventoryOpen=!inventoryOpen;if(k==='1')usePotion();if(k==='escape')inventoryOpen=false;}}keys[k]=true;}
function keyup(e){keys[e.key.toLowerCase()]=false}window.addEventListener('keydown',keydown);window.addEventListener('keyup',keyup);
canvas.addEventListener('pointerdown',e=>{if(screen==='title'){screen='playing';sound(330,.16)}else if(screen==='dead'||screen==='win'){init();screen='playing'}else if(screen==='playing'&&!inventoryOpen)attack()});
document.querySelectorAll('.touchbtn').forEach(b=>{let key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();keys[key]=true;if(key==='j')attack();if(key==='k')dodge();if(key==='e')pickup();});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false));});
function attack(){if(player.attack<=0&&screen==='playing'&&!inventoryOpen){player.attack=.34;sound(175,.1,'sawtooth',.035);}}
function dodge(){if(player.dodge<=0&&player.stamina>=28&&screen==='playing'){player.dodge=.42;player.invuln=.48;player.stamina-=28;player.vx=player.face*560;sound(120,.12,'triangle',.04);for(let i=0;i<8;i++)particle(player.x+16,player.y+40,'#b5a7a1',1)}}
function usePotion(){if(player.potions>0&&player.hp<player.maxHp){player.potions--;player.hp=Math.min(player.maxHp,player.hp+45);toast='A bitter draught restores 45 vitality';toastTime=2;sound(580,.18,'sine',.04);}}
function pickup(){let d=drops.find(d=>!d.got&&Math.hypot(d.x-(player.x+17),d.y-(player.y+35))<75);if(!d)return;d.got=true;if(d.type==='gold'){player.gold+=d.amount;score+=d.amount;toast=`${d.amount} gold pieces`;sound(720,.09)}else if(d.type==='potion'){player.potions=Math.min(9,player.potions+1);toast='Potion added to your satchel';sound(540,.1)}else{let slot=d.item.slot,old=player.gear[slot];if(old){drops.push({x:player.x+35,y:player.y+25,type:'item',item:old,vy:-80,got:false,life:18})}player.gear[slot]=d.item;recalc();toast=`Equipped ${d.item.name}`;sound(660,.17,'sine',.04);floating.push({x:player.x,y:player.y-15,text:`${d.item.rarity.name} · ${d.item.name}`,color:d.item.rarity.color,life:2.4})}toastTime=2;}
function recalc(){player.stats.damage=24;player.stats.armor=0;player.stats.speed=1;for(let it of Object.values(player.gear))if(it){player.stats.damage+=it.damage||0;player.stats.armor+=it.armor||0;player.stats.speed+=it.speed||0}}
function itemDrop(x,y){let roll=Math.random(),r=roll<.48?0:roll<.77?1:roll<.92?2:roll<.985?3:4,slot=['weapon','armor','relic'][Math.floor(Math.random()*3)],base=rarity[r],mult=[1,1.35,1.8,2.4,3.3][r];let item={slot,name:names[slot][Math.floor(Math.random()*names[slot].length)],rarity:base,damage:slot==='weapon'?Math.round((4+r*3+Math.random()*5)*mult):Math.round(r*1.6*mult),armor:slot==='armor'?Math.round((2+r*2)*mult):Math.round(r*.7*mult),speed:slot==='relic'?(Math.random()<.5?.08:0):0};drops.push({x,y,type:'item',item,vy:-150,got:false,life:28});}
function hurtEnemy(e,dmg){e.hp-=dmg;e.hit=.16;e.stun=.16;shake=3;floating.push({x:e.x+e.w/2,y:e.y-4,text:`${Math.round(dmg)}`,color:'#f5d6a2',life:.8});for(let i=0;i<9;i++)particle(e.x+e.w/2,e.y+22,'#bb574b',1.2);sound(90,.06,'square',.02);if(e.hp<=0){e.dead=true;kills++;waveKills++;let xp=e.elite?55:25;player.xp+=xp;while(player.xp>=player.nextXp){player.xp-=player.nextXp;player.level++;player.nextXp=Math.floor(player.nextXp*1.4);player.maxHp+=12;player.hp=Math.min(player.maxHp,player.hp+28);player.stats.damage+=2;toast=`LEVEL ${player.level} · vitality +12`;toastTime=2.5;sound(880,.3,'sine',.05)}if(Math.random()<.65)itemDrop(e.x+e.w/2,e.y+8);if(Math.random()<.38)drops.push({x:e.x+18,y:e.y,type:'gold',amount:Math.ceil(8+Math.random()*24+wave*2),vy:-110,got:false,life:20});if(Math.random()<.13)drops.push({x:e.x+30,y:e.y,type:'potion',vy:-120,got:false,life:20});if(waveKills>=3+wave*2){if(wave>=5){screen='win';return}wave++;waveKills=0;spawnWave();toast=`THE ABBEY DEEPENS · WAVE ${wave}`;toastTime=3}}}
function particle(x,y,color,scale=1){particles.push({x,y,vx:(Math.random()-.5)*190,vy:-Math.random()*180,life:.45+Math.random()*.6,color,size:(2+Math.random()*4)*scale});}
function update(dt){if(screen!=='playing'||inventoryOpen)return;now+=dt;let p=player;p.attack=Math.max(0,p.attack-dt);p.dodge=Math.max(0,p.dodge-dt);p.invuln=Math.max(0,p.invuln-dt);p.stamina=Math.min(100,p.stamina+24*dt);let move=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);if(p.dodge<=0){p.vx=move*225*p.stats.speed;if(move)p.face=Math.sign(move)}if((keys.w||keys.arrowup||keys[' '])&&p.onGround){p.vy=-570;p.onGround=false;sound(250,.06,'triangle',.018)}p.vy+=1450*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(20,Math.min(worldW-p.w-20,p.x));p.onGround=false;let land=[{x:0,y:ground,w:worldW,h:200},...platforms];for(let pl of land){if(p.vy>=0&&p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>=pl.y&&p.y+p.h-p.vy*dt<=pl.y){p.y=pl.y-p.h;p.vy=0;p.onGround=true}}if(p.y>H+180){p.hp=0}
if(p.attack>0.15&&p.attack<.31&&!p.didHit){p.didHit=true;for(let e of enemies){if(e.dead)continue;let dx=(e.x+e.w/2)-(p.x+p.w/2);if(Math.abs(dx)<94&&Math.abs((e.y+e.h/2)-(p.y+p.h/2))<78&&Math.sign(dx)===p.face)hurtEnemy(e,p.stats.damage*(e.elite?1:1))}}if(p.attack===0)p.didHit=false;
for(let e of enemies){if(e.dead)continue;e.hit=Math.max(0,e.hit-dt);e.attack=Math.max(0,e.attack-dt);e.stun=Math.max(0,e.stun-dt);let dx=p.x-e.x;if(e.stun<=0){e.vx=Math.abs(dx)>44?Math.sign(dx)* (e.elite?65:88):0;e.face=dx<0?-1:1}e.x+=e.vx*dt;e.vy+=1300*dt;e.y+=e.vy*dt;if(e.y+e.h>=ground){e.y=ground-e.h;e.vy=0}for(let pl of platforms){if(e.vy>=0&&e.x+e.w>pl.x&&e.x<pl.x+pl.w&&e.y+e.h>=pl.y&&e.y+e.h-e.vy*dt<=pl.y){e.y=pl.y-e.h;e.vy=0}}if(Math.abs(dx)<52&&Math.abs((e.y+e.h/2)-(p.y+p.h/2))<58&&e.attack<=0){e.attack=e.elite?1.15:1.35;if(p.invuln<=0){let dmg=Math.max(4,(e.elite?17:11)-p.stats.armor);p.hp-=dmg;p.invuln=.65;shake=6;floating.push({x:p.x,y:p.y-10,text:`-${dmg}`,color:'#ed7163',life:.9});sound(75,.13,'square',.035);if(p.hp<=0)screen='dead'}}}
enemies=enemies.filter(e=>!e.dead);for(let d of drops){d.vy+=500*dt;d.y+=d.vy*dt;if(d.y>ground-12){d.y=ground-12;d.vy=0}d.life-=dt}drops=drops.filter(d=>d.life>0&&!d.got);for(let a of particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=330*dt;a.life-=dt}particles=particles.filter(a=>a.life>0);for(let f of floating){f.y-=30*dt;f.life-=dt}floating=floating.filter(f=>f.life>0);if(toastTime>0)toastTime-=dt;camera+=(Math.max(0,Math.min(worldW-W,p.x-W*.38))-camera)*Math.min(1,dt*4);}

// Draw helpers
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function line(x,y,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}function text(t,x,y,size,color='#eee',font='Spectral',align='left'){ctx.font=`${size}px ${font}, Georgia, serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}
function bg(){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#111720');grad.addColorStop(.52,'#24212a');grad.addColorStop(1,'#151116');rect(0,0,W,H,grad);let par=camera*.18;for(let i=0;i<8;i++){let x=((i*230-par)%1900+1900)%1900-200;let h=170+(i*83%240);rect(x,ground-h,112,h,'#17171e');rect(x+13,ground-h-18,86,20,'#25212a');rect(x+22,ground-h+26,6,h-26,'#24212b');rect(x+88,ground-h+26,5,h-26,'#24212b');for(let wy=ground-h+46;wy<ground-50;wy+=54){rect(x+44,wy,22,32,'#080c12');rect(x+51,wy+5,7,24,'#773c32')}}
for(let i=0;i<6;i++){let x=((i*310-camera*.4)%1800+1800)%1800-200;rect(x,180,4,ground-180,'#39303a');rect(x-9,170,22,10,'#4e3b3d');rect(x+2,235,2,ground-235,'#594449');rect(x-17,220,36,3,'#493b40');}
// stained moon and distant arches
ctx.globalAlpha=.12;ctx.fillStyle='#b48a72';ctx.beginPath();ctx.arc(980-camera*.06,184,78,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// floor stonework
rect(0,ground,W,H-ground,'#211d20');rect(0,ground,W,6,'#665044');for(let x=-((camera*.8)%128);x<W+128;x+=128){line(x,ground+3,x+36,H,'#342b2c',2);line(x+64,ground+6,x+64,H,'#32282b',1);for(let y=ground+54;y<H;y+=68)line(x-54,y,x+64,y,'#30272a',2)}
// candles and foreground flame
for(let i=0;i<9;i++){let x=((i*191-camera)%1500+1500)%1500;let cy=ground-12-(i%3)*35;rect(x,cy,7,16,'#a17a4c');rect(x+2,cy-7,3,7,'#ffd382');ctx.globalAlpha=.2;ctx.fillStyle='#ffae52';ctx.beginPath();ctx.arc(x+4,cy-6,13+Math.sin(now*9+i)*3,0,7);ctx.fill();ctx.globalAlpha=1;}}
function drawPlatforms(){for(let p of platforms){let x=p.x-camera;rect(x,p.y,p.w,p.h,'#4a3b3b');rect(x,p.y,p.w,4,'#9b7955');for(let i=0;i<p.w;i+=34){line(x+i,p.y+5,x+i+8,p.y+p.h,'#332c32',2);rect(x+i+9,p.y+7,2,2,'#b38b58')}}}
function drawPlayer(){let p=player,x=p.x-camera,y=p.y;ctx.save();if(p.invuln>0&&Math.floor(now*22)%2)ctx.globalAlpha=.42;ctx.translate(x+p.w/2,y);ctx.scale(p.face,1); // cape
ctx.fillStyle='#6b2426';ctx.beginPath();ctx.moveTo(-8,18);ctx.lineTo(-27,52);ctx.lineTo(-11,57);ctx.lineTo(9,39);ctx.closePath();ctx.fill();rect(-11,16,22,31,'#b49a74');rect(-10,22,20,19,'#342b30');rect(-9,2,18,17,'#d0b38b');rect(-12,0,23,6,'#281f24');rect(-7,6,4,3,'#16151a');rect(4,6,4,3,'#16151a');rect(-10,45,9,16,'#2b2428');rect(2,45,9,16,'#2b2428');rect(-12,59,12,5,'#141419');rect(2,59,12,5,'#141419');rect(-13,19,6,5,'#c7ab7b');rect(7,19,6,5,'#c7ab7b');if(p.attack>0){let prog=1-p.attack/.34;ctx.strokeStyle='#eee3c5';ctx.lineWidth=5;ctx.beginPath();ctx.arc(15,30,54,-1.2+prog*1.8,.4+prog*1.8);ctx.stroke();ctx.strokeStyle='#a74639';ctx.lineWidth=2;ctx.beginPath();ctx.arc(15,30,58,-1.2+prog*1.8,.4+prog*1.8);ctx.stroke()}else{line(12,30,31,34,'#b7b0a0',3);line(30,34,36,33,'#f3d9a3',2)}ctx.restore();}
function drawEnemy(e){let x=e.x-camera,y=e.y;ctx.save();ctx.translate(x+e.w/2,y);ctx.scale(e.face,1);if(e.hit>0)ctx.globalAlpha=.55;let coat=e.elite?'#412332':'#45383b',skin=e.elite?'#8f5044':'#857062';rect(-e.w*.34,14,e.w*.68,30,coat);rect(-e.w*.31,8,e.w*.62,18,skin);rect(-e.w*.38,5,e.w*.76,7,'#272128');rect(-e.w*.23,18,6,3,'#ef5945');rect(3,18,6,3,'#ef5945');rect(-e.w*.3,41,9,7,'#272127');rect(2,41,9,7,'#272127');if(e.elite){rect(-e.w*.46,-2,7,17,'#bd6e47');rect(e.w*.32,-2,7,17,'#bd6e47');rect(-e.w*.48,0,3,7,'#e4ad62');rect(e.w*.4,0,3,7,'#e4ad62')}ctx.restore();rect(x-4,y-10,e.w+8,4,'#1b1116');rect(x-4,y-10,(e.w+8)*Math.max(0,e.hp/e.maxHp),4,e.elite?'#cf744c':'#ac4c46');}
function drawDrops(){for(let d of drops){let x=d.x-camera,y=d.y+Math.sin(now*5+d.x)*4;if(d.type==='item'){let col=d.item.rarity.color;ctx.globalAlpha=.17;ctx.fillStyle=d.item.rarity.glow;ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.fill();ctx.globalAlpha=1;rect(x-7,y-9,14,18,'#211b20');rect(x-5,y-7,10,14,col);rect(x-2,y-13,4,5,'#f0d7a1')}else if(d.type==='gold'){ctx.fillStyle='#dfb34c';ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();rect(x-3,y-4,6,8,'#fff0a5')}else{rect(x-6,y-9,12,17,'#7c2933');rect(x-4,y-7,8,13,'#c45854');rect(x-3,y-13,6,5,'#d0b88d')}if(Math.hypot(d.x-(player.x+17),d.y-(player.y+35))<78){let label=d.type==='item'?d.item.name:d.type==='gold'?`${d.amount} GOLD`:'POTION';text('[E] '+label,x,y-23,13,d.type==='item'?d.item.rarity.color:'#f0d89e','Spectral','center')}}}
function drawParticles(){for(let a of particles){ctx.globalAlpha=Math.max(0,a.life);rect(a.x-camera,a.y,a.size,a.size,a.color)}ctx.globalAlpha=1;for(let f of floating){ctx.globalAlpha=Math.min(1,f.life);text(f.text,f.x-camera,f.y,16,f.color,'Spectral','center')}ctx.globalAlpha=1}
function panel(x,y,w,h){rect(x,y,w,h,'#101116eF');rect(x,y,w,1,'#b99b62');rect(x,y+h-1,w,1,'#594333');line(x,y,x,y+h,'#766044');line(x+w,y,x+w,y+h,'#766044')}
function drawHUD(){// ornate status plate
panel(26,52,280,104);text('VITALITY',43,76,11,'#c7b28a');text(`${Math.ceil(player.hp)} / ${player.maxHp}`,283,76,12,'#e7d6b8','Spectral','right');rect(42,86,245,13,'#281a1c');rect(42,86,245*Math.max(0,player.hp/player.maxHp),13,'#a33f3e');rect(42,86,245*Math.max(0,player.hp/player.maxHp),2,'#dd7563');text('STAMINA',43,119,10,'#b5a77f');rect(42,126,245,7,'#222128');rect(42,126,245*player.stamina/100,7,'#a18d4e');text(`LV ${player.level}`,44,146,11,'#d7c18e');text(`✦ ${player.gold}`,282,146,12,'#dfba65','Spectral','right');
// XP
rect(0,790,W,10,'#211b20');rect(0,790,W*player.xp/player.nextXp,10,'#968044');rect(0,790,W*player.xp/player.nextXp,2,'#e5c777');
// equipped
panel(W-235,52,209,127);text('RELICS WORN',W-219,73,11,'#c7b28a');let labels=[['weapon','I'],['armor','II'],['relic','III']];labels.forEach(([s,n],i)=>{let item=player.gear[s],yy=94+i*26;rect(W-219,yy-13,20,20,item?item.rarity.color:'#343239');text(n,W-209,yy+2,10,'#171519','Spectral','center');text(item?item.name:'— EMPTY —',W-192,yy+2,11,item?item.rarity.color:'#777078');});
// wave & objective
text(`ABBEY DEPTH  ${String(wave).padStart(2,'0')} / 05`,W/2,36,13,'#c6ad7b','Spectral','center');text(`${enemies.length} REMAINING`,W/2,56,10,'#a69a86','Spectral','center');
// potion pill
panel(W-149,H-65,122,42);text('1',W-135,H-39,15,'#edcc86');text(`POTION  ×${player.potions}`,W-113,H-39,11,'#d6c6a9');
if(toastTime>0){ctx.globalAlpha=Math.min(1,toastTime*2);panel(W/2-210,87,420,39);text(toast,W/2,112,15,'#f1d89c','Spectral','center');ctx.globalAlpha=1}}
function drawInventory(){rect(0,0,W,H,'#050609bb');panel(280,115,720,565);text('THE HUNTER’S SATCHEL',640,157,25,'#e2cb98','IM Fell English SC','center');text('WORN RELICS',320,205,12,'#b8a274');let slots=[['weapon','I · HAND'],['armor','II · RAIMENT'],['relic','III · CHARM']];slots.forEach(([s,label],i)=>{let x=320+i*216,it=player.gear[s];panel(x,223,195,106);text(label,x+14,245,10,'#a8a095');text(it?it.name:'No relic equipped',x+14,274,15,it?it.rarity.color:'#777');text(it?`${it.rarity.name}   +${it.damage||0} DMG   +${it.armor||0} ARM`: 'Find relics in the abbey',x+14,302,10,'#c4b8a1')});text('HUNTER’S LEDGER',320,373,12,'#b8a274');panel(320,388,640,91);text(`Damage   ${player.stats.damage}`,342,419,14,'#e4d7bf');text(`Armor   ${player.stats.armor}`,540,419,14,'#e4d7bf');text(`Vitality   ${player.maxHp}`,720,419,14,'#e4d7bf');text(`Level ${player.level}     ${player.xp} / ${player.nextXp} XP     ${player.gold} gold`,342,451,13,'#bbad95');text('A relic replaces the item in its slot. Displaced gear falls at your feet.',640,525,12,'#9b9180','Spectral','center');text('[ I ]  CLOSE SATCHEL',640,632,13,'#e1c582','Spectral','center')}
function vignette(){let g=ctx.createRadialGradient(W/2,H/2,180,W/2,H/2,760);g.addColorStop(0,'#0000');g.addColorStop(1,'#0009');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function overlay(title,subtitle,button){rect(0,0,W,H,'#05060bc9');panel(280,170,720,455);text('ASHEN COVENANT',640,254,39,'#e4c990','IM Fell English SC','center');text('RELIC HUNTER',640,286,13,'#a69a82','Spectral','center');line(440,311,840,311,'#816c4c');text(title,640,371,22,'#f0e2c6','Spectral','center');text(subtitle,640,417,14,'#c0b49f','Spectral','center');panel(490,468,300,51);text(button,640,501,15,'#f2d89e','Spectral','center');text('A cursed abbey. A bottomless appetite for relics.',640,555,12,'#8e867b','Spectral','center');if(screen==='title'){text('WASD / ARROWS MOVE　 ·　 SPACE JUMP　 ·　 J WHIP　 ·　 K DODGE',640,592,11,'#a99d88','Spectral','center');text('E CLAIM LOOT　 ·　 I SATCHEL　 ·　 1 POTION',640,611,11,'#a99d88','Spectral','center')}}
function render(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-.6)}ctx.clearRect(0,0,W,H);bg();drawPlatforms();drawDrops();for(let e of enemies)drawEnemy(e);drawPlayer();drawParticles();drawHUD();vignette();if(inventoryOpen)drawInventory();if(screen==='title')overlay('THE BELLS HAVE FALLEN','Descend into the Sunken Abbey. Hunt its keepers. Take what they leave.','[ ENTER ]  BEGIN THE HUNT');if(screen==='dead')overlay('YOUR COVENANT ENDS HERE',`You reached depth ${wave} · ${kills} slain · ${player.gold} gold`,'[ ENTER ]  RISE AGAIN');if(screen==='win')overlay('THE ABBEY IS SILENT',`You broke the final ward · ${kills} keepers slain`,'[ ENTER ]  HUNT AGAIN');ctx.restore()}
function frame(ts){let dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></main></body></html>
